<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <!-- 添加视口元标签 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>通运铁路信息</title>
    <link rel="icon" href="./res/gtr.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dialog.css">
    <link rel="stylesheet" href="preferences.css">
</head>
<body>
<div class="app-container">
    <header>
        <div class="actions"> 
            <a href="index.html" class="icon-btn back-btn">
                <span class="material-symbols-outlined">
                arrow_back
                </span>
            </a>
        </div>
        <div class="title">
            <img src="./res/gtr.png" alt="logo">
            <h1></h1>
        </div>
        <div class="gradient-blur"></div>
    </header>
    <main>
    </main>
</div>
<style>
    .cover-img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        transform-origin: bottom;
        overflow: visible;
    }
    .content { 
        background: transparent;
        box-shadow: none;
    }
    .cover .content { 
        z-index: 1;
        -webkit-backdrop-filter: var(--background-filter-transparent);
        backdrop-filter: var(--background-filter-transparent);
        background: var(--color-background-card-transparent);
        margin-bottom: 3em;
    }
    .cover-title { 
        height: 30dvw;
        max-height: 50vh;
        padding: 0 12px;
        display: flex;
        align-items: flex-end;
        transition: all 0.3s ease-in-out;
    }
    .cover-title.collapsed { 
        opacity: 0;
        transform: translateY(-24px);
        filter: blur(24px);
    }
    .cover .title {
        opacity: 0;
    }
    .effect-reduced .cover-img {
        position: relative;
        width: 100%;
        transform-origin: center;
        overflow: hidden;
        -webkit-mask-image:none;
        mask-image: none;
        max-height: 40dvh;
    }
    .effect-reduced .cover-title {
        display: none;
    }
    .effect-reduced .cover .title {
        opacity: 1;
    }
    .effect-reduced .content {
        padding: 0;
    }
    @media (prefers-reduced-transparency: reduce) {
        .cover-img {
            position: relative;
            width: 100%;
            transform-origin: center;
            overflow: hidden;
            -webkit-mask-image:none;
            mask-image: none;
        max-height: 40dvh;
        }
        .cover-title {
            display: none;
        }
        .cover .title {
            opacity: 1;
        }
        .content {
            padding: 0;
        }
    }
</style>
<script src="script.js"></script>
<script src="layout.js"></script>
<script src="dialog.js"></script>
<script src="keyboard.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
    function handleWindowResize() {}
    window.handleWindowResize = handleWindowResize;
    // 修复：将事件处理器声明为async函数
    document.addEventListener("DOMContentLoaded", async function() {
        fetch ('strings.json')
        .then(response => response.json())
        .then(async data => {
            strings = data;
            fetch('./data/network.json')
                .then(response => response.json())
                .then(async data => { 
                    window.stationsNetwork = data.stations;
                    fetch('./data/lines.json')
                        .then(response => response.json())
                        .then(async data => { 
                            window.lines = data.lines;
                            const typeParam = new URLSearchParams(window.location.search).get('type');
                            const queryParam = new URLSearchParams(window.location.search).get('q');
                            const main = document.querySelector('main');
                            const appContainer = document.querySelector('.app-container');
                            const h1 = document.querySelector('h1');
                            const title = document.querySelector('title');
                            const header = document.querySelector('header');
                            let contnet;
                            switch (typeParam) {
                                case 'series':
                                    contnet = await loadSeriesInfo(queryParam,false);
                                    break;
                                case 'station':
                                    contnet = await loadStationInfo(queryParam,false);
                                    break;
                                case 'history':
                                            console.log(window.lines);
                                    contnet = await loadHistory(false);
                                    break;
                                default:
                                    window.location.href = '404.html';
                                    break;
                            }
                            console.log(contnet);
                            if (contnet) {
                                contnet.classList.add('content');
                                contnet.classList.add('item');
                                //contnet.style.background = 'transparent';
                                //contnet.style.boxShadow = 'none';
                                main.appendChild(contnet);
                                h1.textContent = contnet.dataset.title;
                                title.textContent = contnet.dataset.title+' - '+strings.mainpage.gtr_info[lang];
                                if (contnet.dataset.cover) {
                                    const cover = document.createElement('img');
                                    //cover.classList.add('item');
                                    cover.src = contnet.dataset.cover;
                                    cover.classList.add('cover-img');
                                    cover.style.padding = 0;
                                    main.insertBefore(cover,contnet);
                                    appContainer.classList.add('cover');
                                    const coverTitleContainer = document.createElement('div');
                                    coverTitleContainer.classList.add('cover-title');
                                    const coverTitle = document.createElement('h1');
                                    coverTitle.textContent = contnet.dataset.title;
                                    coverTitleContainer.appendChild(coverTitle);
                                    main.insertBefore(coverTitleContainer,contnet);
                                }
                            } else {
                                window.location.href = '404.html';
                            }
                            let scrollY = 0;
                            document.addEventListener('scroll', function() {
                                const cover = document.querySelector('.cover-img');
                                if (cover) {
                                    scrollY = window.scrollY;
                                    //console.log(scrollY);
                                    handleScroll();
                                }
                            });
                            appContainer.addEventListener('scroll', function() {
                                const cover = document.querySelector('.cover-img');
                                if (cover) {
                                    scrollY = appContainer.scrollTop;
                                    //console.log(scrollY);
                                    handleScroll();
                                }
                            });
                            function handleScroll() {
                                const cover = document.querySelector('.cover-img');
                                if (cover) {
                                    //console.log(scrollY);
                                    const coverTitle = document.querySelector('.cover-title');
                                    const title = document.querySelector('.title');
                                    const titleHeight = coverTitle.getBoundingClientRect().height;
                                    const maxScroll = titleHeight - 72;
                                    const scrollProgress = Math.min(1, Math.max(0, scrollY / maxScroll));
                                    const maxOpacity = 1;
                                    const minOpacity = 0;
                                    const opacity = maxOpacity-scrollProgress*1.1;
                                    cover.style.opacity = opacity;
                                    const maxBlur = 36;
                                    const minBlur = 0;
                                    const blur = maxBlur * scrollProgress;
                                    cover.style.filter = `blur(${blur}px)`;
                                    const maxScale = 1.1;
                                    const minScale = 1;
                                    const scale = minScale + (maxScale - minScale) * scrollProgress;
                                    cover.style.transform = `scale(${scale})`;
                                    if (scrollY > titleHeight - 72) {
                                        coverTitle.classList.add('collapsed');
                                        title.style.opacity = 1;
                                    } else {
                                        coverTitle.classList.remove('collapsed');
                                        title.style.opacity = 0;
                                    }
                                }
                            }
                            const coverImg = document.querySelector('.cover-img');
                            coverImg?.addEventListener('error', function() { 
                                const coverTitle = document.querySelector('.cover-title');
                                coverTitle.style.height = 'fit-content';
                            });
                        })
                })
        })
        .catch(error => {
            console.error('Error loading strings.json:', error);
        });
    });
</script>
</body>
</html>

<script>
    // 修复：将事件处理器声明为async函数
    document.addEventListener("DOMContentLoaded", async function() {
        fetch ('strings.json')
        .then(response => response.json())
        .then(async data => {
            strings = data;
            await pushDialog(strings['404'].check_your_link_and_try_again[lang], 'alert', strings['404'].page_not_found[lang]);
            location.href = './index.html?lang=' + lang;
        })
        .catch(error => {
            console.error('Error loading strings.json:', error);
        });
    });
</script>

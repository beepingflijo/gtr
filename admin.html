<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>用户管理 - 通运铁路信息</title>
    <link rel="icon" href="./res/gtr.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="preferences.css">
    <link rel="stylesheet" href="dialog.css"></link>
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 6em;
        }

        #adminContent, #loginLogContent {
            width: -webkit-fill-available;
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--color-border);
        }
        
        .admin-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--color-text);
        }
        
        .user-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(6em, 1fr));
            gap: 16px;
            margin-bottom: 30px;
            padding: 0 30px;
        }
        
        .user-table-container {
            overflow: hidden;
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--color-border) transparent;
        }
        
        .user-table {
            width: -webkit-fill-available;
            border-collapse: collapse;
            border-bottom: 2px solid var(--color-border);
            margin-bottom: 1em;
        }
        
        .user-table th {
            min-width: 5em;
            background: var(--color-bg-tertiary);
            padding: 16px;
            padding-block-start: 8px;
            text-align: left;
            font-weight: 600;
            color: var(--color-text);
            border-bottom: 2px solid var(--color-border);
        }
        
        .user-table td {
            padding: 16px;
            border-bottom: 1px solid var(--color-border);
            color: var(--color-text);
        }
        
        .user-table tr:hover {
            background: var(--color-bg-hover);
        }
        
        .user-table tr:last-child td {
            border-bottom: none;
        }

        .action-btn { 
            margin: 4px;
            text-wrap: nowrap;
            display: inline-flex;
            flex-direction: row;
            padding: 0.2em 0.4em;
            background-color: var(--color-secondary-hover);
        }

        .action-btn:hover { 
            background-color: var(--color-secondary-hover);
        }
        
        .btn-delete {
            color: crimson;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--color-text-secondary);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--color-text-secondary);
        }
        
        .error-message {
            background: rgba(220, 20, 60, 0.1);
            border: 1px solid crimson;
            color: crimson;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--color-primary);
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.2s;
        }
        
        .back-link:hover {
            background: var(--color-bg-hover);
        }

        .selection.segment.filter-tabs { 
            gap: 4px;
            margin: 0;
            margin-block-end: 1em;
            max-width: -webkit-fill-available;
        }

        .selection-item.filter-tab { 
            padding: 0.2em 0.5em !important;
            min-width: fit-content !important;
            overflow: visible !important;
        }

        .filter-tab .badge {
            background: rgba(255,255,255,0.3);
            padding: 2px;
            border-radius: 10px;
            font-size: 12px;
            min-width: 18px;
            text-align: center;
            border: 1px solid var(--color-primary);
        }

        .filter-tab:not(.active) .badge {
            color: var(--color-text-secondary);
            border: 1px solid var(--color-text-secondary);
        }

        .status-badge {
            display: inline-block;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            text-wrap: nowrap;
        }

        .status-approved {
            background: rgba(76, 175, 80, 0.15);
            color: #4caf50;
        }

        .status-pending {
            background: rgba(255, 152, 0, 0.15);
            color: #ff9800;
        }

        .status-rejected {
            background: rgba(244, 67, 54, 0.15);
            color: #f44336;
        }

        .btn-approve {
            color: #4caf50;
        }

        .btn-reject {
            color: #ff9800;
        }

        .verification-note-text {
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            color: var(--color-primary);
            text-decoration: underline;
            text-decoration-style: dotted;
        }

        @media (max-width: 768px) {
            .user-table {
                font-size: 14px;
            }
            
            .user-table th,
            .user-table td {
                padding: 12px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="actions"> 
                <a href="preferences.html" class="icon-btn back-link" title="返回偏好设置">
                    <span class="material-symbols-outlined">arrow_back</span>
                </a>
            </div>
            <div class="title">
                <img src="./res/gtr.png" alt="logo">
                <h1>用户管理</h1>
            </div>
            <div class="gradient-blur"></div>
        </header>
        
        <main class="admin-container">
            <div style="margin-bottom:20px;padding:0 30px;">
                <div class="selection segment no-collapse admin-tabs" style="gap:4px;">
                    <span class="selection-item active" data-tab="users" onclick="switchAdminTab('users')" style="padding:4px 12px;cursor:pointer;">用户管理</span>
                    <span class="selection-item" data-tab="loginlog" onclick="switchAdminTab('loginlog')" style="padding:4px 12px;cursor:pointer;">登录日志</span>
                </div>
            </div>
            <div id="adminContent">
                <div class="loading">加载中...</div>
            </div>
            <div id="loginLogContent" style="display:none;">
                <div class="loading">加载中...</div>
            </div>
        </main>
    </div>
    
    <script src="auth.js"></script>
    <script src="script.js"></script>
    <script src="layout.js"></script>
    <script>
        /*const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:3000/api' 
            : '/api';*/
        
        // 等待strings和lang初始化完成
        async function waitForInitialization() {
            return new Promise((resolve) => {
                // 检查是否已经初始化
                if (window.strings && window.lang) {
                    resolve();
                    return;
                }
                
                // 监听DOMContentLoaded事件（如果还没触发）
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', () => {
                        // 再等待一小段时间确保script.js完成初始化
                        setTimeout(resolve, 200);
                    });
                } else {
                    // DOM已加载，等待script.js的异步操作完成
                    setTimeout(resolve, 300);
                }
            });
        }
        
        // 检查管理员权限
        async function checkAdminAccess() {
            // 等待初始化完成
            await waitForInitialization();
            
            const user = window.auth.getCurrentUser();
            
            if (!user) {
                showErrorMessage('请先登录');
                setTimeout(() => {
                    window.location.href = 'preferences.html';
                }, 2000);
                return false;
            }
            
            if (user.username !== 'admin') {
                showErrorMessage('需要管理员权限才能访问此页面');
                setTimeout(() => {
                    window.location.href = 'preferences.html';
                }, 2000);
                return false;
            }
            
            return true;
        }
        
        // 显示错误消息
        function showErrorMessage(message) {
            const content = document.getElementById('adminContent');
            content.innerHTML = `
                <div class="error-message">
                    <strong>错误：</strong>${message}
                </div>
            `;
        }
        
        // 加载用户列表
        async function loadUsers() {
            const session = window.auth.getUserSession ? window.auth.getUserSession() : null;
            
            if (!session || !session.token) {
                showErrorMessage('未登录或会话已过期');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/admin/users`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${session.token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Failed to load users');
                }
                
                const data = await response.json();
                
                if (data.success) {
                    renderUserList(data.data.users);
                } else {
                    showErrorMessage(data.message || '加载失败');
                }
            } catch (error) {
                console.error('Error loading users:', error);
                showErrorMessage('加载用户列表失败，请检查网络连接');
            }
        }
        
        // 渲染用户列表
        function renderUserList(users) {
            const content = document.getElementById('adminContent');
            
            if (!users || users.length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <span class="material-symbols-outlined" style="font-size: 64px; margin-bottom: 16px;">people_outline</span>
                        <h3>暂无用户</h3>
                        <p>系统中还没有注册用户</p>
                    </div>
                `;
                return;
            }
            
            // 计算统计数据
        const totalUsers = users.length;
        const adminCount = users.filter(u => u.username === 'admin').length;
        const withEmail = users.filter(u => u.email).length;
        const pendingCount = users.filter(u => u.verificationStatus === 'pending').length;
        const rejectedCount = users.filter(u => u.verificationStatus === 'rejected').length;
        
        content.innerHTML = `
            <div class="stats-container user-stats">
                <div class="stat-card">
                    <div class="stats-num">${totalUsers}</div>
                    <div class="stats-desc">总用户数</div>
                </div>
                <div class="stat-card">
                    <div class="stats-num">${pendingCount}</div>
                    <div class="stats-desc">待审核</div>
                </div>
                <div class="stat-card">
                    <div class="stats-num">${adminCount}</div>
                    <div class="stats-desc">管理员账户</div>
                </div>
                <div class="stat-card">
                    <div class="stats-num">${withEmail}</div>
                    <div class="stats-desc">已绑定邮箱</div>
                </div>
            </div>
            
            <div class="selection segment filter-tabs">
                <span class="selection-item filter-tab active" data-filter="all">全部 <span class="badge">${totalUsers}</span></span>
                <span class="selection-item filter-tab" data-filter="pending">待审核 <span class="badge">${pendingCount}</span></span>
                <span class="selection-item filter-tab" data-filter="approved">已通过 <span class="badge">${users.filter(u => (u.verificationStatus || 'approved') === 'approved').length}</span></span>
                <span class="selection-item filter-tab" data-filter="rejected">已拒绝 <span class="badge">${rejectedCount}</span></span>
            </div>
            
            <div class="item user-table-container">
                <table class="user-table">
                    <thead>
                        <tr>
                            <th>用户名</th>
                            <th>审核状态</th>
                            <th>服务器账户</th>
                            <th>申请说明</th>
                            <th>邮箱</th>
                            <th>注册时间</th>
                            <th>最后登录</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${users.map(user => {
                            const vs = user.verificationStatus || 'approved';
                            const statusLabel = vs === 'approved' ? '已通过' : vs === 'pending' ? '待审核' : '已拒绝';
                            return `
                                <tr data-user-id="${user.id}" data-verification="${vs}">
                                    <td><strong>${escapeHtml(user.username)}</strong></td>
                                    <td><span class="status-badge status-${vs}">${statusLabel}</span></td>
                                    <td>${user.authmeBound ? `<span style="color: var(--color-primary);">${escapeHtml(user.authmeUsername || 'N/A')}</span>` : '<em style="color: #999;">未绑定</em>'}</td>
                                    <td>${user.verificationNote ? `<span class="verification-note-text" onclick="viewNote('${escapeHtml(user.username)}', this.dataset.note)" data-note="${escapeHtml(user.verificationNote)}" title="点击查看完整内容">${escapeHtml(user.verificationNote)}</span>` : '<em style="color: #999;">—</em>'}</td>
                                    <td>${user.email ? escapeHtml(user.email) : '<em>未设置</em>'}</td>
                                    <td>${formatDate(user.createdAt)}</td>
                                    <td>${user.lastLogin ? formatDate(user.lastLogin) : '<em>从未登录</em>'}</td>
                                    <td>
                                        <div class="icon-btn action-btn btn-reset" onclick="resetPassword('${user.id}', '${escapeHtml(user.username)}')" title="重置密码"><span class="material-symbols-outlined">refresh</span>重置</div>
                                        ${vs === 'pending' ? `
                                            <div class="icon-btn action-btn btn-approve" onclick="verifyUser('${user.id}', '${escapeHtml(user.username)}', 'approve')" title="批准"><span class="material-symbols-outlined">check</span>批准</div>
                                            <div class="icon-btn action-btn btn-reject" onclick="verifyUser('${user.id}', '${escapeHtml(user.username)}', 'reject')" title="拒绝"><span class="material-symbols-outlined">close</span>拒绝</div>
                                        ` : ''}
                                        ${user.username !== 'admin' ? `
                                            <div class="icon-btn action-btn btn-delete" onclick="deleteUser('${user.id}', '${escapeHtml(user.username)}')" title="注销账户"><span class="material-symbols-outlined">delete</span></div>
                                        ` : ''}
                                    </td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            </div>
        `;

        content.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                content.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const filter = tab.dataset.filter;
                content.querySelectorAll('tbody tr').forEach(row => {
                    if (filter === 'all' || row.dataset.verification === filter) {
                        row.style.display = '';
                    } else {
                        row.style.display = 'none';
                    }
                });
            });
        });
    }
        
        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 格式化日期
        function formatDate(dateString) {
            if (!dateString) return '未知';
            const date = new Date(dateString);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        // 删除用户
        async function deleteUser(userId, username) {
            if (!confirm(`确定要删除用户 "${username}" 吗？此操作不可恢复！`)) {
                return;
            }
            
            const session = window.auth.getUserSession ? window.auth.getUserSession() : null;
            
            try {
                const response = await fetch(`${API_BASE_URL}/admin/users/${userId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${session.token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('用户删除成功');
                    loadUsers(); // 重新加载列表
                } else {
                    alert('删除失败：' + data.message);
                }
            } catch (error) {
                console.error('Error deleting user:', error);
                alert('删除失败，请检查网络连接');
            }
        }
        
        // 重置密码
        async function resetPassword(userId, username) {
            const newPassword = prompt(`请输入用户 "${username}" 的新密码（至少6个字符）：`);
            
            if (!newPassword) {
                return;
            }
            
            if (newPassword.length < 6) {
                alert('密码长度至少为6个字符');
                return;
            }
            
            const session = window.auth.getUserSession ? window.auth.getUserSession() : null;
            
            try {
                const response = await fetch(`${API_BASE_URL}/admin/users/${userId}/reset-password`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${session.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ newPassword })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('密码重置成功');
                } else {
                    alert('重置失败：' + data.message);
                }
            } catch (error) {
                console.error('Error resetting password:', error);
                alert('重置失败，请检查网络连接');
            }
        }
        
        // 审批用户注册
        async function verifyUser(userId, username, action) {
            const actionLabel = action === 'approve' ? '批准' : '拒绝';
            if (!confirm(`确定要${actionLabel}用户 "${username}" 的注册申请吗？`)) {
                return;
            }
            
            const session = window.auth.getUserSession ? window.auth.getUserSession() : null;
            
            try {
                const response = await fetch(`${API_BASE_URL}/admin/users/${userId}/verify`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${session.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ action })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert(`已${actionLabel}用户 "${username}"`);
                    loadUsers();
                } else {
                    alert(`${actionLabel}失败：` + data.message);
                }
            } catch (error) {
                console.error('Error verifying user:', error);
                alert(`${actionLabel}失败，请检查网络连接`);
            }
        }

        // 查看申请说明
        function viewNote(username, note) {
            if (!note) return;
            const content = document.createElement('div');
            content.innerHTML = `
                <div style="padding: 8px 0; line-height: 1.6; white-space: pre-wrap; word-break: break-all;">${escapeHtml(note)}</div>
            `;
            pushDialog(content, 'custom', `${username} 的申请说明`);
        }
        
        function switchAdminTab(tab) {
            const userContent = document.getElementById('adminContent');
            const logContent = document.getElementById('loginLogContent');
            const tabs = document.querySelectorAll('.admin-tabs .selection-item');
            tabs.forEach(t => t.classList.remove('active'));
            const selectedTab = document.querySelector(`.admin-tabs .selection-item[data-tab="${tab}"]`);
            if (selectedTab) selectedTab.classList.add('active');
            if (tab === 'users') {
                userContent.style.display = '';
                logContent.style.display = 'none';
            } else {
                userContent.style.display = 'none';
                logContent.style.display = '';
                loadLoginLog();
            }
        }

        // ==================== 登录日志查看 ====================

        async function loadLoginLog(username = '', limit = 100, offset = 0) {
            const session = window.auth.getUserSession ? window.auth.getUserSession() : null;
            if (!session || !session.token) {
                showErrorMessage('未登录或会话已过期');
                return;
            }

            try {
                let url = `${API_BASE_URL}/admin/login-log?limit=${limit}&offset=${offset}`;
                if (username) url += `&username=${encodeURIComponent(username)}`;

                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${session.token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error('Failed to load login log');

                const data = await response.json();
                if (data.success) {
                    renderLoginLog(data.data.items, data.data.total, username);
                } else {
                    showErrorMessage(data.message || '加载失败');
                }
            } catch (error) {
                console.error('Error loading login log:', error);
                showErrorMessage('加载登录日志失败，请检查网络连接');
            }
        }

        function renderLoginLog(items, total, filterUsername) {
            const container = document.getElementById('loginLogContent');
            if (!container) return;

            if (!items || items.length === 0) {
                container.innerHTML = '<div class="empty-state"><h3>暂无登录日志</h3><p>还没有登录记录</p></div>';
                return;
            }

            container.innerHTML = `
                <div class="item user-table-container">
                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:0 16px;">
                        <input type="text" id="logUsernameFilter" placeholder="按用户名筛选" value="${escapeHtml(filterUsername)}" style="max-width:200px;padding:6px 10px;border:1px solid var(--color-border);border-radius:4px;background:var(--color-bg);color:var(--color-text);">
                        <div class="icon-btn action-btn" onclick="loadLoginLog(document.getElementById('logUsernameFilter').value)" style="padding:4px 8px;">
                            <span class="material-symbols-outlined">search</span>筛选
                        </div>
                        <span style="color:var(--color-text-secondary);font-size:0.85em;">共 ${total} 条记录</span>
                    </div>
                    <table class="user-table">
                        <thead>
                            <tr>
                                <th>用户名</th>
                                <th>操作类型</th>
                                <th>IP地址</th>
                                <th>设备类型</th>
                                <th>浏览器</th>
                                <th>操作系统</th>
                                <th>时间</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map(entry => `
                                <tr>
                                    <td><strong>${escapeHtml(entry.username)}</strong></td>
                                    <td><span class="status-badge status-${entry.action === 'register' ? 'pending' : 'approved'}">${entry.action === 'register' ? '注册' : '登录'}</span></td>
                                    <td><code style="font-size:0.85em;">${escapeHtml(entry.ip || '未知')}</code></td>
                                    <td>${entry.deviceType === 'mobile' ? '移动端' : entry.deviceType === 'tablet' ? '平板' : '桌面端'}</td>
                                    <td>${escapeHtml(entry.browser || '未知')}</td>
                                    <td>${escapeHtml(entry.os || '未知')}</td>
                                    <td>${formatDate(entry.timestamp)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // 页面加载时执行
        document.addEventListener('DOMContentLoaded', async () => {
            const hasAccess = await checkAdminAccess();
            if (hasAccess) {
                loadUsers();
            }
        });
    </script>
</body>
</html>

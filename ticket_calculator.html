<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <!-- 添加视口元标签 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>票价计算 - 通运铁路信息</title>
    <link rel="icon" href="./res/gtr.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="ticket_calculator.css">
</head>
<body>
<div class="app-container">
    <header>
        <div class="item side-bar" style="opacity: 0;"> 
            <div class="side-bar-header">
                <div class="icon-btn side-bar-btn">
                    <img src="./res/indent.png" alt="collapse" class="icon"></img>
                </div>
            </div>
            <div class="side-bar-list side-bar-navigation">
                <div class="side-bar-item">
                    <div class="icon-btn lines-btn">
                        <img src="./res/tracking.png" alt="line" class="icon"></img>
                        <span>线路信息</span>
                    </div>
                </div>
                <div class="side-bar-item active">
                    <div class="icon-btn fare-btn active">
                        <img src="./res/cash.png" alt="fare" class="icon active"></img>
                        <span>票价计算</span>
                    </div>
                    <div class="search-controls">
                        <div class="item search-panel selection no-collapse">
                            <div class="icon-btn item-title search-title">
                                <img src="./res/search.png" alt="search" class="icon"></img>
                                <h4>Search</h4>
                            </div>
                            <section class="input-section">
                                <input type="text" placeholder="出发站" id="startInput" list="start-stations"></input>
                                <div class="icon-btn swap-btn">
                                    <img src="./res/swap.png" alt="swap" class="icon"></img>
                                    <span>Swap</span>
                                </div>
                                <input type="text" placeholder="到达站" id="endInput" list="end-stations"></input>
                            </section>
                            <section class="search-actions">
                                <button id="searchBtn" class="active">搜索</button>
                                <button id="clearBtn">清空</button>
                            </section>
                        </div>
                        <div class="item sort-selector selection no-collapse"> 
                            <div class="icon-btn selection-item sort-by-time active">
                                <img src="./res/timer.png" alt="Faster" class="icon"></img>
                                <span>Faster</span>
                            </div>
                            <div class="icon-btn selection-item sort-by-transfers">
                                <img src="./res/sync.png" alt="Direct" class="icon"></img>
                                <span>Direct</span>
                            </div>
                            <div class="icon-btn selection-item sort-by-price">
                                <img src="./res/money_box.png" alt="Cheaper" class="icon"></img>
                                <span>Cheaper</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="side-bar-item">
                    <div class="icon-btn trains-btn">
                        <img src="./res/train.png" alt="train" class="icon"></img>
                        <span>列车信息</span>
                    </div>
                </div>
            </div>
            <div class="side-bar-list">
                <div class="side-bar-item"> 
                    <div class="icon-btn preferences-btn">
                        <img src="./res/profile.png" alt="preferences" class="icon"></img>
                        <span>偏好设置</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="title">
            <img src="./res/gtr.png" alt="logo">
            <h1>票价计算</h1>
        </div>
        <div class="actions pref-actions"> 
            <div class="icon-btn preferences-btn">
                <img src="./res/profile.png" alt="preferences" class="icon"></img>
            </div>
        </div>
        <div class="gradient-blur"></div>
    </header>
    <main>
        <section class="search-result">
            <!-- 通过 JavaScript 动态添加 -->
        </section>
    </main>
    <footer style="opacity: 0;">
        <div class="actions tabs"> 
            <div class="tab-item">
                <div class="icon-btn lines-btn">
                    <img src="./res/tracking.png" alt="line" class="icon"></img>
                    <span class="tab-text">线路信息</span>
                </div>
            </div>
            <div class="tab-item active">
                <div class="icon-btn fare-btn active">
                    <img src="./res/cash.png" alt="fare" class="icon active"></img>
                    <span class="tab-text">票价计算</span>
                </div>
            </div>
            <div class="tab-item">
                <div class="icon-btn trains-btn">
                    <img src="./res/train.png" alt="train" class="icon"></img>
                    <span class="tab-text">列车信息</span>
                </div>
            </div>
        </div>
        <div class="search-controls">
            <div class="item search-panel selection">
                <div class="icon-btn item-title search-title">
                    <img src="./res/search.png" alt="search" class="icon"></img>
                    <h4>Search</h4>
                </div>
                <section class="input-section">
                    <input type="text" placeholder="出发站" id="startInput" list="start-stations"></input>
                    <div class="icon-btn swap-btn">
                        <img src="./res/swap.png" alt="swap" class="icon"></img>
                        <span>Swap</span>
                    </div>
                    <input type="text" placeholder="到达站" id="endInput" list="end-stations"></input>
                </section>
                <section class="search-actions">
                    <button id="searchBtn" class="active">搜索</button>
                    <button id="clearBtn">清空</button>
                </section>
            </div>
            <div class="item sort-selector selection segment no-collapse"> 
                <div class="icon-btn selection-item sort-by-time active">
                    <img src="./res/timer.png" alt="Faster" class="icon"></img>
                    <span>Faster</span>
                </div>
                <div class="icon-btn selection-item sort-by-transfers">
                    <img src="./res/sync.png" alt="Direct" class="icon"></img>
                    <span>Direct</span>
                </div>
                <div class="icon-btn selection-item sort-by-price">
                    <img src="./res/money_box.png" alt="Cheaper" class="icon"></img>
                    <span>Cheaper</span>
                </div>
            </div>
        </div>
    </footer>
</div>
<script src="script.js"></script>
<script src="ticket_calculator.js" type="module"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</body>
</html>

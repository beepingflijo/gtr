<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <link rel="icon" href="./res/gtr.png" type="image/png">
</head>
<body>
<script>
    // 获取用户最后访问的页面
    const visitedPagesStr = localStorage.getItem('visitedPages');
    
    // 默认跳转到 lines_info.html
    let redirectPage = 'lines_info.html';
    let redirectParams = '';
    let finalParams = '';
    
    // 如果有记录最后访问的页面，则跳转到该页面
    if (visitedPagesStr) {
        var visitedPages = JSON.parse(visitedPagesStr);
        let latestTimestamp = 0;
        visitedPages.forEach(page => {
            if (page.timestamp > latestTimestamp) {
                latestTimestamp = page.timestamp;
                redirectPage = page.page;
                redirectParams = page.params;
            }
        });
    }
    
    // 获取当前URL参数
    const urlParams = new URLSearchParams(window.location.search);
    const currentParams = urlParams.toString();
    
    if (currentParams) {
        // 创建URLSearchParams对象以便操作参数
        const finalParamsObj = new URLSearchParams();
        
        // 先添加URL中的所有参数
        urlParams.forEach((value, key) => {
            finalParamsObj.set(key, value);
        });
        
        // 如果localStorage中有参数，则覆盖URL中的参数（localStorage优先）
        if (redirectParams) {
            const localStorageUrlParams = new URLSearchParams(redirectParams);
            localStorageUrlParams.forEach((value, key) => {
                finalParamsObj.set(key, value);
            });
        }

        const lang = urlParams.get('lang');

        // lang参数以目前语言为准
        finalParamsObj.set('lang', lang);
        
        // 转换回字符串
        finalParams = finalParamsObj.toString();
    } else if (redirectParams) {
        // 如果URL中没有参数但localStorage中有参数，则使用localStorage的参数
        finalParams = redirectParams;
    } else {
        // 如果URL和localStorage都没有参数，则使用默认参数
        finalParams = '?lang=zh_hans';
    }
    
    // 构造跳转URL
    const redirectURL = `${redirectPage}${finalParams ? '?' + finalParams : ''}`;
    
    // 跳转到目标页面
    window.location.href = redirectURL;
</script>
</body>
</html>

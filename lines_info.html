<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <!-- 添加视口元标签 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>线路信息</title>
    <link rel="icon" href="./res/gtr.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="lines_info.css">
</head>
<body>
<div class="app-container">
    <header>
        <div class="item side-bar" style="opacity: 0;"> 
            <div class="side-bar-header">
                <div class="icon-btn side-bar-btn">
                    <img src="./res/indent.png" alt="collapse" class="icon"></img>
                </div>
            </div>
            <div class="side-bar-list side-bar-navigation">
                <div class="side-bar-item active">
                    <div class="icon-btn lines-btn active">
                        <img src="./res/tracking.png" alt="line" class="icon active"></img>
                        <span>线路信息</span>
                    </div>
                    <div class="selection line-selector no-collapse"></div>
                </div>
                <div class="side-bar-item">
                    <div class="icon-btn fare-btn">
                        <img src="./res/cash.png" alt="fare" class="icon"></img>
                        <span>票价计算</span>
                    </div>
                </div>
                <div class="side-bar-item">
                    <div class="icon-btn trains-btn">
                        <img src="./res/train.png" alt="train" class="icon"></img>
                        <span>列车信息</span>
                    </div>
                </div>
            </div>
            <div class="side-bar-list">
                <div class="side-bar-item"> 
                    <div class="icon-btn preferences-btn">
                        <img src="./res/profile.png" alt="preferences" class="icon"></img>
                        <span>偏好设置</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="title">
            <h1>线路信息</h1>
        </div>
        <!-- <div class="language-selection selection collapsed"> 
            语言选项将通过 JavaScript 动态添加
        </div> -->
        <div class="actions"> 
            <div class="icon-btn map-btn">
                <img src="./res/route.png" alt="map" class="icon"></img>
            </div>
            <div class="icon-btn share-btn">
                <img src="./res/image.png" alt="share" class="icon"></img>
            </div>
        </div>
        <div class="actions pref-actions"> 
            <div class="icon-btn preferences-btn">
                <img src="./res/profile.png" alt="preferences" class="icon"></img>
            </div>
        </div>
        <div class="gradient-blur"></div>
    </header>
    <main>
        <!-- <section class="line-selection">
            线路选择按钮将会通过 JavaScript 动态添加
        </section> -->
        <section class="stations-display">
            <!-- 车站信息将会通过 JavaScript 动态添加 -->
        </section>
    </main>
    <footer style="opacity: 0;">
        <div class="actions tabs"> 
            <div class="tab-item active">
                <div class="icon-btn lines-btn active">
                    <img src="./res/tracking.png" alt="line" class="icon active"></img>
                    <span class="tab-text">线路信息</span>
                </div>
                <div class="selection line-selector"></div>
            </div>
            <div class="tab-item">
                <div class="icon-btn fare-btn">
                    <img src="./res/cash.png" alt="fare" class="icon"></img>
                    <span class="tab-text">票价计算</span>
                </div>
            </div>
            <div class="tab-item">
                <div class="icon-btn trains-btn">
                    <img src="./res/train.png" alt="train" class="icon"></img>
                    <span class="tab-text">列车信息</span>
                </div>
            </div>
        </div>
        <div class="selection line-selector collapsed"></div>
    </footer>
</div>
<script src="script.js"></script>
<script src="lines_info.js" type="module"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <!-- 添加视口元标签 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>线路信息 - 通运铁路信息</title>
    <link rel="icon" href="./res/gtr.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="lines_info.css">
    <link rel="stylesheet" href="dialog.css">
</head>
<body>
<div class="app-container">
    <header>
        <div class="item side-bar collapsed" style="opacity: 0;"> 
             <!-- 侧边栏内容将通过 JavaScript 动态添加 -->
        </div>
        <div class="title">
            <h1>线路信息</h1>
        </div>
        <!-- <div class="language-selection selection collapsed"> 
            语言选项将通过 JavaScript 动态添加
        </div> -->
        <div class="actions"> 
            <div class="icon-btn map-btn">
                <span class="material-symbols-outlined" style="position: relative;">
                cast
                </span>
            </div>
            <div class="icon-btn share-btn">
                <span class="material-symbols-outlined">
                file_save
                </span>
            </div>
        </div>
        <div class="actions pref-actions"> 
        </div>
        <div class="gradient-blur"></div>
    </header>
    <main>
        <!-- <section class="line-selection">
            线路选择按钮将会通过 JavaScript 动态添加
        </section> -->
        <section class="stations-display">
            <!-- 车站信息将会通过 JavaScript 动态添加 -->
        </section>
    </main>
    <footer style="opacity: 0;">
        <div class="actions tabs"> 
        </div>
        <div class="selection line-selector collapsed"></div>
    </footer>
</div>
<script src="cloud-sync.js"></script>
<script src="script.js"></script>
    
<script src="auth.js"></script>
<script src="layout.js"></script>
<script src="dialog.js"></script>
<script src="keyboard.js"></script>
<script src="position_utils.js"></script>
<script src="train_data_source.js"></script>
<script src="lines_info.js" type="module"></script>
<div class="map-overlay" id="map-overlay">
    <div class="map-header">
        <div class="actions map-header-actions">
            <div class="icon-btn" id="map-fit-btn" title="">
                <span class="material-symbols-outlined">fit_screen</span>
            </div>
            <div class="icon-btn" id="map-trains-toggle" title="">
                <span class="material-symbols-outlined">directions_subway</span>
            </div>
        </div>
    </div>
    <div class="map-canvas-container" id="map-canvas-container">
        <canvas id="map-canvas"></canvas>
        <div class="map-zoom-indicator" id="map-zoom-indicator">100%</div>
        <div class="map-controls">
            <div class="actions icon-btn map-ctrl-btn" id="map-zoom-in" title="">
                <span class="material-symbols-outlined">add</span>
            </div>
            <div class="actions icon-btn map-ctrl-btn" id="map-zoom-out" title="">
                <span class="material-symbols-outlined">remove</span>
            </div>
        </div>
        <div class="tooltip map-tooltip" id="map-tooltip">
            <div class="tooltip-title map-tooltip-title" id="map-tooltip-title"></div>
            <div class="map-tooltip-body" id="map-tooltip-body"></div>
        </div>
    </div>
</div>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>时刻表计算监控 - 通运铁路信息</title>
    <link rel="icon" href="./res/gtr.png" type="image/png">
    <style>
        :root {
            --color-bg: #f5f5f5;
            --color-bg-card: #ffffff;
            --color-text: #333333;
            --color-text-secondary: #666666;
            --color-border: #e0e0e0;
            --color-primary: #1976d2;
            --color-success: #2e7d32;
            --color-warning: #ed6c02;
            --color-error: #d32f2f;
        }

        [data-theme="dark"] {
            --color-bg: #121212;
            --color-bg-card: #1e1e1e;
            --color-text: #e0e0e0;
            --color-text-secondary: #999999;
            --color-border: #333333;
            --color-primary: #90caf9;
            --color-success: #66bb6a;
            --color-warning: #ffb74d;
            --color-error: #ef5350;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--color-background);
            color: var(--color-text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--color-border);
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
        }

        .refresh-btn {
            padding: 10px 20px;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .refresh-btn:hover {
            opacity: 0.9;
        }

        main {
            max-width: 960px !important;
        }

        main > * {
           width: -webkit-fill-available;
           overflow-x: auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--color-background-card);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--color-border);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-card .label {
            font-size: 12px;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: var(--color-text);
        }

        .stat-card .unit {
            font-size: 14px;
            color: var(--color-text-secondary);
            margin-left: 4px;
        }

        .stats-item.success .stats-num {
            color: var(--color-success);
        }

        .stats-item.warning .stats-num {
            color: var(--color-warning);
        }

        .stats-item.error .stats-num {
            color: var(--color-error);
        }

        .progress-section {
            background: var(--color-background-card);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 30px;
            border: 1px solid var(--color-border);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .progress-title {
            font-size: 16px;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 24px;
            overflow: hidden;
            position: relative;
            border-radius: 12px;
            background: var(--color-background);
            box-shadow: var(--input-shadow-inset);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--color-primary-transparent), var(--color-primary));
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: end;
            font-size: 12px;
            color: var(--color-text-on-primary);
            padding: 0 1em;
            border-radius: 12px;
            filter: var(--filter-item-shadow);
            font-weight: 600;
        }

        .segments-table {
            width: -webkit-fill-available;
            border-collapse: collapse;
            background: var(--color-background-card);
            border-radius: 12px;
            overflow: hidden;
            overflow-x: auto;
            border: 1px solid var(--color-border);
        }

        .segments-table th {
            background: var(--color-background);
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--color-text-secondary);
            border-bottom: 2px solid var(--color-border);
        }

        .segments-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--color-border);
            color: var(--color-text);
        }

        .segments-table tr:last-child td {
            border-bottom: none;
        }

        .segments-table tr:hover td {
            background: var(--color-background);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge.actual {
            background: rgba(46, 125, 50, 0.1);
            color: var(--color-success);
        }

        .status-badge.default {
            background: rgba(237, 108, 2, 0.1);
            color: var(--color-warning);
        }

        .last-update {
            font-size: 12px;
            color: var(--color-text-secondary);
        }

        .train-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(6em, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .train-item {
            background: var(--color-background);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        .train-item .train-name {
            font-weight: 600;
            color: var(--color-primary);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--color-text-secondary);
        }

        .error {
            text-align: center;
            padding: 20px;
            color: var(--color-error);
            background: rgba(211, 47, 47, 0.1);
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dialog.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="actions"> 
                <div class="icon-btn back-btn" onclick="">
                    <div class="material-symbols-outlined">
                        arrow_back
                    </div>
                </div>
            </div>
            <div class="title">
                <h1>时刻表计算监控</h1>
            </div>
            <div class="actions"> 
                <div class="icon-btn refresh-btn" onclick="refreshData()">
                    <div class="material-symbols-outlined">
                        refresh
                    </div>
                </div>
            </div>
            <div class="gradient-blur"></div>
        </header>

        <main class="main">
            <div id="error" class="error" style="display: none;"></div>

            <div class="stats-container">
                <div class="stats-item success">
                    <div class="stats-desc">收集进度</div>
                    <div class="stats-num" id="progress">--<small>%</small></div>
                </div>
                <div class="stats-item">
                    <div class="stats-desc">总区间数</div>
                    <div class="stats-num" id="totalSegments">--</div>
                </div>
                <div class="stats-item success">
                    <div class="stats-desc">实际数据</div>
                    <div class="stats-num" id="actualSegments">--</div>
                </div>
                <div class="stats-item warning">
                    <div class="stats-desc">使用默认值</div>
                    <div class="stats-num" id="defaultSegments">--</div>
                </div>
                <div class="stats-item">
                    <div class="stats-desc">样本总数</div>
                    <div class="stats-num" id="totalSamples">--</div>
                </div>
                <div class="stats-item">
                    <div class="stats-desc">追踪列车数</div>
                    <div class="stats-num" id="trainCount">--</div>
                </div>
                <div class="stats-item">
                    <div class="stats-desc">总站点数</div>
                    <div class="stats-num" id="totalStations">--</div>
                </div>
                <div class="stats-item">
                    <div class="stats-desc">站点停留样本</div>
                    <div class="stats-num" id="stationDwellSamples">--</div>
                </div>
                <div class="stats-item success">
                    <div class="stats-desc">已收集站点</div>
                    <div class="stats-num" id="stationDwellStations">--</div>
                </div>
                <div class="stats-item">
                    <div class="stats-desc">当前停站列车</div>
                    <div class="stats-num" id="trainsAtStation">--</div>
                </div>
            </div>

            <div class="item">
                <div class="progress-header">
                    <span class="progress-title">整体收集进度</span>
                    <span id="progressText">--</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressBar" style="width: 0%">0%</div>
                </div>
            </div>

            <div class="item">
                <div class="progress-header">
                    <span class="progress-title">正在追踪的列车</span>
                </div>
                <div class="train-list" id="trainList">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <div class="item">
                <div class="progress-header">
                    <span class="progress-title">区间详情</span>
                </div>
                <table class="segments-table">
                    <thead>
                        <tr>
                            <th>线路</th>
                            <th>区间</th>
                            <th>数据来源</th>
                            <th>用时 (秒)</th>
                            <th>样本数</th>
                            <th>最后更新</th>
                        </tr>
                    </thead>
                    <tbody id="segmentsBody">
                        <tr>
                            <td colspan="6" class="loading">加载中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="item">
                <div class="progress-header">
                    <span class="progress-title">站点停留时间详情</span>
                </div>
                <table class="segments-table">
                    <thead>
                        <tr>
                            <th>线路</th>
                            <th>站点</th>
                            <th>方向</th>
                            <th>数据来源</th>
                            <th>停留时间 (秒)</th>
                            <th>样本数</th>
                            <th>最后更新</th>
                        </tr>
                    </thead>
                    <tbody id="stationDwellBody">
                        <tr>
                            <td colspan="7" class="loading">加载中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="item">
                <div class="progress-header">
                    <span class="progress-title">列车时刻表（推算数据）</span>
                    <span id="scheduleCount" class="last-update">--</span>
                </div>
                <table class="segments-table">
                    <thead>
                        <tr>
                            <th>列车编号</th>
                            <th>型号</th>
                            <th>线路</th>
                            <th>方向</th>
                            <th>前方到站</th>
                            <th>到站时间</th>
                            <th>停站数</th>
                            <th>最后更新</th>
                        </tr>
                    </thead>
                    <tbody id="trainSchedulesBody">
                        <tr>
                            <td colspan="8" class="loading">加载中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="item">
        </main>
    </div>

    <script src="script.js" defer></script>
    <script src="layout.js" defer></script>
    <script src="position_utils.js"></script>
    <script>
        const API_BASE = './api/timetable';

        async function fetchJson(url) {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            return response.json();
        }

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error').style.display = 'none';
        }

        function updateStats(data) {
            document.getElementById('progress').innerHTML = `${data.progress}<small>%</small>`;
            document.getElementById('totalSegments').textContent = data.totalSegments;
            document.getElementById('actualSegments').textContent = data.actualSegments;
            document.getElementById('defaultSegments').textContent = data.defaultSegments;
            document.getElementById('totalSamples').textContent = data.totalSamples;
            document.getElementById('trainCount').textContent = data.trainTrackingCount;
            document.getElementById('totalStations').textContent = data.totalStations || 0;
            document.getElementById('stationDwellSamples').textContent = data.stationDwellSamples || 0;
            document.getElementById('stationDwellStations').textContent = data.stationDwellStations || 0;
            document.getElementById('trainsAtStation').textContent = data.trainsAtStation || 0;

            // 更新进度条
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = `${data.progress}%`;
            progressBar.textContent = `${data.progress}%`;
            document.getElementById('progressText').textContent = 
                `${data.actualSegments} / ${data.totalSegments} 区间已收集实际数据`;
        }

        function updateTrainList(trains) {
            const container = document.getElementById('trainList');
            if (!trains || trains.length === 0) {
                container.innerHTML = '<div class="loading">暂无追踪列车</div>';
                return;
            }

            container.innerHTML = trains.map(train => `
                <div class="train-item" style="--color-primary: #${PositionUtils.getLineColor(train.lineId)};">
                    <div class="train-name">${train.name}</div>
                    <div>线路: ${train.lineId || '未知'}</div>
                </div>
            `).join('');
        }

        // 从线路数据中提取区间的起终点站名
        function getSegmentEndpoints(line, segmentIndex) {
            if (!line || !line.route) return { from: '?', to: '?' };
            const route = line.route;
            let fromStation = '?';
            let toStation = '?';
            // 向前找最近的站点
            for (let i = segmentIndex - 1; i >= 0; i--) {
                if (route[i].type === 'station') {
                    fromStation = route[i].code;
                    break;
                }
            }
            // 向后找最近的站点
            for (let i = segmentIndex + 1; i < route.length; i++) {
                if (route[i].type === 'station') {
                    toStation = route[i].code;
                    break;
                }
            }
            return { from: fromStation, to: toStation };
        }

        function updateSegmentsTable(segments, lines) {
            const tbody = document.getElementById('segmentsBody');
            if (!segments || Object.keys(segments).length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="loading">暂无数据</td></tr>';
                return;
            }

            let html = '';
            for (const [lineId, lineSegments] of Object.entries(segments)) {
                const lineObj = lines[lineId];
                const lineName = lineObj?.name?.zh_hans || lineObj?.name?.en || lineId;
                for (const [segmentKey, data] of Object.entries(lineSegments)) {
                    const [segmentIndex, direction] = segmentKey.split(':');
                    const directionText = direction === '1' ? '正向' : direction === '-1' ? '反向' : '';
                    const lastUpdate = data.lastUpdate 
                        ? new Date(data.lastUpdate).toLocaleString('zh-CN')
                        : '-';
                    const endpoints = getSegmentEndpoints(lineObj, parseInt(segmentIndex));
                    
                    html += `
                        <tr>
                            <td>${lineName}</td>
                            <td>${endpoints.from} → ${endpoints.to} ${directionText ? `(${directionText})` : ''}</td>
                            <td>
                                <span class="status-badge ${data.source}">
                                    ${data.source === 'actual' ? '实际数据' : '默认值'}
                                </span>
                            </td>
                            <td>${data.duration ? data.duration.toFixed(1) : '-'}</td>
                            <td>${data.sampleCount}</td>
                            <td class="last-update">${lastUpdate}</td>
                        </tr>
                    `;
                }
            }
            tbody.innerHTML = html;
        }

        function getStationNameFromLines(lines, stationCode) {
            for (const line of Object.values(lines)) {
                if (line.route) {
                    for (const seg of line.route) {
                        if (seg.type === 'station' && seg.code === stationCode) {
                            return stationCode;
                        }
                    }
                }
            }
            return stationCode;
        }

        function updateStationDwellTable(dwellData, lines) {
            const tbody = document.getElementById('stationDwellBody');
            if (!dwellData || Object.keys(dwellData).length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="loading">暂无站点停留时间数据</td></tr>';
                return;
            }

            let html = '';
            for (const [lineId, stationEntries] of Object.entries(dwellData)) {
                const lineObj = lines[lineId];
                const lineName = lineObj?.name?.zh_hans || lineObj?.name?.en || lineId;
                
                for (const [stationKey, data] of Object.entries(stationEntries)) {
                    const [stationCode, direction] = stationKey.split(':');
                    const directionText = direction === '1' ? '正向' : direction === '-1' ? '反向' : '';
                    const lastUpdate = data.lastUpdate 
                        ? new Date(data.lastUpdate).toLocaleString('zh-CN')
                        : '-';
                    
                    html += `
                        <tr>
                            <td>${lineName}</td>
                            <td>${stationCode}</td>
                            <td>${directionText}</td>
                            <td>
                                <span class="status-badge ${data.source}">
                                    ${data.source === 'actual' ? '实际数据' : '默认值'}
                                </span>
                            </td>
                            <td>${data.dwellTime ? data.dwellTime.toFixed(1) : '-'}</td>
                            <td>${data.sampleCount}</td>
                            <td class="last-update">${lastUpdate}</td>
                        </tr>
                    `;
                }
            }
            tbody.innerHTML = html;
        }

        async function loadLinesData() {
            try {
                const data = await fetchJson('./data/lines.json');
                const lines = {};
                for (const line of data.lines) {
                    lines[line.id] = line;
                }
                return lines;
            } catch (error) {
                console.error('加载线路数据失败:', error);
                return {};
            }
        }

        function updateTrainSchedulesTable(schedules, lines) {
            const tbody = document.getElementById('trainSchedulesBody');
            const countEl = document.getElementById('scheduleCount');

            if (!schedules || schedules.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="loading">暂无推算时刻表数据</td></tr>';
                countEl.textContent = '共 0 条';
                return;
            }

            countEl.textContent = `共 ${schedules.length} 条`;

            // 按线路和列车名称排序
            schedules.sort((a, b) => {
                if (a.lineId !== b.lineId) return a.lineId.localeCompare(b.lineId);
                return a.trainName.localeCompare(b.trainName);
            });

            let html = '';
            for (const schedule of schedules) {
                const lineObj = lines[schedule.lineId];
                const lineName = schedule.lineName || lineObj?.name?.zh_hans || schedule.lineId;

                // 找到下一个未到达的站点
                const now = new Date();
                let nextStop = null;
                let nextStopIndex = -1;
                for (let i = 0; i < schedule.stops.length; i++) {
                    const stopTime = new Date(schedule.stops[i].arrivalTime);
                    if (stopTime > now) {
                        nextStop = schedule.stops[i];
                        nextStopIndex = i;
                        break;
                    }
                }

                const directionText = schedule.direction === 'forward' ? '正向' : '反向';
                const nextStopName = nextStop ? nextStop.stationName : '已完成';
                const nextStopTime = nextStop ? new Date(nextStop.arrivalTime).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '--';
                const stopsRemaining = nextStopIndex >= 0 ? schedule.stops.length - nextStopIndex : 0;
                const lastUpdated = schedule.lastUpdated
                    ? new Date(schedule.lastUpdated).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                    : '--';

                html += `
                    <tr>
                        <td><strong>${schedule.trainName}</strong></td>
                        <td>${schedule.trainSeries || '--'}</td>
                        <td>${lineName}</td>
                        <td>${directionText}</td>
                        <td>${nextStopName}</td>
                        <td>${nextStopTime}</td>
                        <td>${stopsRemaining}</td>
                        <td class="last-update">${lastUpdated}</td>
                    </tr>
                `;
            }
            tbody.innerHTML = html;
        }

        async function refreshData() {
            hideError();

            try {
                // 并行加载所有数据
                const [statusResult, segmentsResult, trainsResult, dwellResult, schedulesResult, lines] = await Promise.all([
                    fetchJson(`${API_BASE}/collector-status`),
                    fetchJson(`${API_BASE}/segment-durations`),
                    fetchJson(`${API_BASE}/tracked-trains`),
                    fetchJson(`${API_BASE}/station-dwell-times`),
                    fetchJson(`${API_BASE}/train-schedules`),
                    loadLinesData()
                ]);

                if (statusResult.success) {
                    updateStats(statusResult.data);
                } else {
                    showError('获取状态失败: ' + (statusResult.error || '未知错误'));
                }

                if (segmentsResult.success) {
                    updateSegmentsTable(segmentsResult.data, lines);
                }

                if (trainsResult.success) {
                    updateTrainList(trainsResult.data);
                }

                if (dwellResult.success) {
                    updateStationDwellTable(dwellResult.data, lines);
                }

                if (schedulesResult.success) {
                    updateTrainSchedulesTable(schedulesResult.data.schedules, lines);
                }

            } catch (error) {
                showError('加载数据失败: ' + error.message);
                console.error('刷新数据失败:', error);
            }
        }

        // 页面加载时刷新数据
        document.addEventListener('DOMContentLoaded', refreshData);

        // 每 30 秒自动刷新
        setInterval(refreshData, 30000);
    </script>
</body>
</html>
